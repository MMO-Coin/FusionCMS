ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/html/(system|vendor|docker|tests|docs|output|temp|application/config|application/(modules|themes)/[^/]+/config)(/|$)">
        Require all denied
        ErrorDocument 403 default
    </DirectoryMatch>

    <Directory /var/lib/fusioncms>
        Require all denied
        ErrorDocument 403 default
    </Directory>

    <DirectoryMatch "^/var/www/html/writable/(backups|logs|install|session|sessions)(/|$)">
        Require all denied
        ErrorDocument 403 default
    </DirectoryMatch>

    <Directory /var/www/html/writable/cache>
        Require all denied
        ErrorDocument 403 default
    </Directory>

    <Directory /var/www/html/writable/cache/data/minify>
        <FilesMatch "\.(css|js)(\.map)?$">
            Require all granted
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/writable>
        AllowOverride None
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar)(\.|$)">
            Require all denied
            ErrorDocument 403 default
        </FilesMatch>
    </Directory>

    <FilesMatch "(^\.|^(composer\.(json|lock)|package(-lock)?\.json|compose.*\.ya?ml|Dockerfile)$)">
        Require all denied
        ErrorDocument 403 default
    </FilesMatch>
</VirtualHost>
