name: PHP and browser tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.36', '8.4.27', '8.5.12']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fusion_test
          MYSQL_DATABASE: fusion_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfusion_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, gmp, gd, intl, soap, zip, mbstring, sqlite3
          tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Audit locked Composer dependencies
      run: composer audit --locked --no-interaction

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run configuration regression tests
      run: php tests/config_editor_test.php

    - name: Run PHP requirement regression tests
      run: php tests/php_requirements_test.php

    - name: Run HTTP response regression tests
      run: php tests/http_response_test.php

    - name: Run CSRF HTTP regression tests
      run: php tests/security_csrf_test.php

    - name: Run request throttling regression tests
      run: php tests/throttler_test.php

    - name: Run donation security and schema regression tests
      env:
        FUSION_TEST_MYSQL_HOST: 127.0.0.1
        FUSION_TEST_MYSQL_PASSWORD: fusion_test
      run: php tests/donation_security_test.php

    - name: Run donation request regression tests
      run: php tests/donation_controller_test.php

    - name: Run password reset regressions and concurrent token claims
      env:
        FUSION_TEST_MYSQL_HOST: 127.0.0.1
        FUSION_TEST_MYSQL_PASSWORD: fusion_test
      run: php tests/password_recovery_test.php

    - name: Run remember-me regressions and concurrent rotation and revocation
      env:
        FUSION_TEST_MYSQL_HOST: 127.0.0.1
        FUSION_TEST_MYSQL_PASSWORD: fusion_test
      run: php tests/remember_me_test.php

    - name: Run donation frontend regression tests
      run: node tests/donation_frontend_test.cjs

    - name: Setup Node.js for browser tests
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/browser/package-lock.json

    - name: Install browser test dependencies
      run: npm ci --prefix tests/browser

    - name: Install Chromium
      working-directory: tests/browser
      run: npx playwright install --with-deps chromium

    - name: Run authentication and donation browser tests
      env:
        FUSION_E2E_DB_HOST: 127.0.0.1
        FUSION_E2E_DB_PASSWORD: fusion_test
      run: npm test --prefix tests/browser

    - name: Upload browser reports and diagnostics
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: browser-php-${{ matrix.php }}
        path: |
          output/playwright/report/
          output/playwright/results/
          output/playwright/logs/
        if-no-files-found: ignore
        retention-days: 7
