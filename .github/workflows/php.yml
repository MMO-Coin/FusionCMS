name: PHP Composer

env:
  PHP_VERSION: '8.3.36'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: ${{ env.PHP_VERSION }}

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Audit locked Composer dependencies
      run: composer audit --locked --no-interaction

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run configuration regression tests
      run: php tests/config_editor_test.php

    - name: Run PHP requirement regression tests
      run: php tests/php_requirements_test.php
